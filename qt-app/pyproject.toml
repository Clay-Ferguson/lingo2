[project]
name = "lingo-voice-typer"
version = "0.1.0"
description = "PyQt6 system-wide voice-to-text input app"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "sounddevice>=0.4.6",
    "numpy>=1.21.0",
    "PyYAML>=6.0",
]

# Not an installable package: uv only builds the virtualenv from the
# dependencies above, and run.sh runs the code straight out of the tree.
[tool.uv]
package = false
